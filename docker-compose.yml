version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: kintral-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:////app/kintral.db
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DATASET_DIR=/app/retailmind_dmart_dataset
    volumes:
      - kintral_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kintral-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - PORT=3000
    depends_on:
      - api

volumes:
  kintral_data:
